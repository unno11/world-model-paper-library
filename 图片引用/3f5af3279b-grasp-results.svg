<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f8fafc"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:16px}.s{font-size:14px}.axis{stroke:#475569;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1}.g{fill:#16a34a}.c{fill:#64748b}.d{fill:#2563eb}.l{fill:#dc2626}.box{stroke:#334155;stroke-width:2;rx:12}</style>
<text x="40" y="48" class="title">核心实验：长时域 Push-T 中，GRASP 随 horizon 增长退化更慢</text>
<text x="40" y="76" class="s">依据论文 Table 1 重绘；每格为 Success / median successful planning time，500 trials；指标是在 learned world model 内评估。</text>
<rect x="45" y="115" width="520" height="560" class="box" fill="#fff"/><text x="75" y="155" class="h">成功率（%）</text>
<line x1="100" y1="610" x2="525" y2="610" class="axis"/><line x1="100" y1="200" x2="100" y2="610" class="axis"/>
<g class="grid"><line x1="100" y1="508" x2="525" y2="508"/><line x1="100" y1="405" x2="525" y2="405"/><line x1="100" y1="303" x2="525" y2="303"/><line x1="100" y1="200" x2="525" y2="200"/></g>
<text x="67" y="615" class="s">0</text><text x="60" y="513" class="s">25</text><text x="60" y="410" class="s">50</text><text x="60" y="308" class="s">75</text><text x="53" y="205" class="s">100</text>
<polyline points="125,359 220,486 315,580 410,578 505,598" fill="none" stroke="#64748b" stroke-width="4"/><polyline points="125,400 220,456 315,542 410,561 505,584" fill="none" stroke="#dc2626" stroke-width="4"/><polyline points="125,359 220,456 315,543 410,561 505,584" fill="none" stroke="#2563eb" stroke-width="4"/><polyline points="125,368 220,432 315,503 410,544 505,567" fill="none" stroke="#16a34a" stroke-width="5"/>
<g class="s"><text x="112" y="635">H40</text><text x="207" y="635">H50</text><text x="302" y="635">H60</text><text x="397" y="635">H70</text><text x="492" y="635">H80</text></g>
<g class="s"><text x="115" y="660" fill="#64748b">CEM</text><text x="180" y="660" fill="#dc2626">GD</text><text x="230" y="660" fill="#2563eb">LatCo</text><text x="302" y="660" fill="#16a34a">GRASP</text></g>
<rect x="615" y="115" width="540" height="560" class="box" fill="#fff"/><text x="645" y="155" class="h">Table 1 数值摘要</text>
<text x="650" y="198" class="b">Horizon</text><text x="760" y="198" class="b">CEM</text><text x="865" y="198" class="b">GD</text><text x="970" y="198" class="b">GRASP</text>
<g class="s"><text x="650" y="240">40</text><text x="760" y="240">61.4 / 35.3s</text><text x="865" y="240">51.0 / 18.0s</text><text x="970" y="240">59.0 / 8.5s</text><text x="650" y="295">50</text><text x="760" y="295">30.2 / 96.2s</text><text x="865" y="295">37.6 / 76.3s</text><text x="970" y="295">43.4 / 15.2s</text><text x="650" y="350">60</text><text x="760" y="350">7.2 / 83.1s</text><text x="865" y="350">16.4 / 146.5s</text><text x="970" y="350">26.2 / 49.1s</text><text x="650" y="405">70</text><text x="760" y="405">7.8 / 156.1s</text><text x="865" y="405">12.0 / 103.1s</text><text x="970" y="405">16.0 / 79.9s</text><text x="650" y="460">80</text><text x="760" y="460">2.8 / 132.2s</text><text x="865" y="460">6.4 / 161.3s</text><text x="970" y="460">10.4 / 58.9s</text></g>
<line x1="645" y1="500" x2="1125" y2="500" stroke="#cbd5e1"/><text x="650" y="545" class="b">读法：H=50 时，GRASP 成功率 43.4%，</text><text x="650" y="575" class="b">中位成功时间 15.2s；CEM 为 30.2% / 96.2s。</text><text x="650" y="625" class="s">注意：这是 open-loop、模型内成功，不等同真实机器人成功率。</text>
