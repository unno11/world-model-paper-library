<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.p{font-size:16px}.s{font-size:14px}.axis{stroke:#334155;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1}</style></defs>
<rect width="1200" height="650" fill="#f8fafc"/><text x="42" y="48" class="title">Why hierarchy helps: error and search-space diagnostics</text><text x="42" y="77" class="p">A long-horizon model makes fewer autoregressive jumps, while macro-actions reduce the dimension of CEM search.</text>
<rect x="45" y="115" width="535" height="430" rx="16" fill="#fff" stroke="#334155" stroke-width="2"/><text x="312" y="150" text-anchor="middle" class="h">Prediction error vs horizon (qualitative redraw)</text><text x="312" y="175" text-anchor="middle" class="s">paper: low-level better ≤1s; high-level better ≥1.5s</text><line x1="100" y1="490" x2="525" y2="490" class="axis"/><line x1="100" y1="220" x2="100" y2="490" class="axis"/><line x1="100" y1="400" x2="525" y2="400" class="grid"/><line x1="100" y1="310" x2="525" y2="310" class="grid"/><text x="80" y="495" class="s">0</text><text x="72" y="405" class="s">medium</text><text x="72" y="315" class="s">high</text><text x="70" y="225" class="s">error</text><text x="300" y="520" text-anchor="middle" class="s">prediction horizon</text><polyline points="120,465 190,430 260,380 330,310 400,245 500,220" fill="none" stroke="#64748b" stroke-width="5"/><polyline points="120,470 190,465 260,458 330,440 400,390 500,320" fill="none" stroke="#f59e0b" stroke-width="5"/><line x1="345" y1="215" x2="375" y2="215" stroke="#64748b" stroke-width="5"/><text x="384" y="220" class="s">low-level AR</text><line x1="345" y1="240" x2="375" y2="240" stroke="#f59e0b" stroke-width="5"/><text x="384" y="245" class="s">high-level one-step</text><text x="270" y="285" class="s" fill="#b45309">crossover ≈ 1.5s</text>
<rect x="620" y="115" width="535" height="430" rx="16" fill="#fff" stroke="#334155" stroke-width="2"/><text x="887" y="150" text-anchor="middle" class="h">Search complexity intuition</text><text x="887" y="177" text-anchor="middle" class="s">if primitive action dimension is large, flat CEM scales poorly</text><rect x="680" y="230" width="380" height="88" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="870" y="266" text-anchor="middle" class="p">Flat MPC</text><text x="870" y="292" text-anchor="middle" class="p">search over a₁, a₂, …, aH</text><text x="870" y="350" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:44px;font-weight:700;fill:#b91c1c">Aᴴ</text><text x="870" y="380" text-anchor="middle" class="s">long horizon → many candidate sequences</text><rect x="680" y="420" width="380" height="88" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="870" y="456" text-anchor="middle" class="p">HWM high level</text><text x="870" y="482" text-anchor="middle" class="p">search over l₁, l₂, …, lᴴ</text><text x="870" y="540" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:40px;font-weight:700;fill:#15803d">Lᴴ, L≪A</text><text x="870" y="570" text-anchor="middle" class="s">low level only refines the next subgoal</text>
<text x="600" y="615" text-anchor="middle" style="font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#0f172a">注意：层级不是免费午餐——高层子目标过粗会损失精细控制信息</text>
</svg>
