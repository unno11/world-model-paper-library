<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#334155"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033} .title{font-size:28px;font-weight:700}.h{font-size:21px;font-weight:700}.p{font-size:17px}.s{font-size:15px}.box{stroke:#334155;stroke-width:2;rx:16}.small{font-size:14px}</style></defs>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="45" y="48" class="title">HWM: Hierarchical Planning in a Shared Latent Space</text>
<text x="45" y="78" class="p">Top-down MPC: macro-actions propose a reachable subgoal; primitive actions realize it.</text>
<rect x="55" y="125" width="190" height="95" class="box" fill="#e0f2fe"/><text x="150" y="160" text-anchor="middle" class="h">Current image</text><text x="150" y="190" text-anchor="middle" class="p">s₁ → z₁ = E(s₁)</text>
<rect x="55" y="285" width="190" height="95" class="box" fill="#e0f2fe"/><text x="150" y="320" text-anchor="middle" class="h">Goal image</text><text x="150" y="350" text-anchor="middle" class="p">sᵍ → zᵍ = E(sᵍ)</text>
<path d="M245 172 L330 172" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M245 332 L330 332" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<rect x="335" y="105" width="350" height="220" class="box" fill="#fef3c7"/><text x="510" y="145" text-anchor="middle" class="h">High-level planner</text><text x="510" y="175" text-anchor="middle" class="p">F²: long-horizon latent world model</text><text x="510" y="203" text-anchor="middle" class="p">l₁: macro-action (dim = 4)</text><text x="510" y="235" text-anchor="middle" class="p">CEM optimizes l₁:H</text><text x="510" y="270" text-anchor="middle" class="p">min ‖F²(l₁:H; z₁) − zᵍ‖₁</text><text x="510" y="301" text-anchor="middle" class="small">few coarse steps → less error accumulation</text>
<path d="M685 215 L770 215" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="727" y="195" text-anchor="middle" class="small">first predicted z̃₁</text>
<rect x="775" y="105" width="365" height="220" class="box" fill="#dcfce7"/><text x="957" y="145" text-anchor="middle" class="h">Low-level planner</text><text x="957" y="175" text-anchor="middle" class="p">F¹: short-horizon latent dynamics</text><text x="957" y="203" text-anchor="middle" class="p">a₁:h: primitive actions</text><text x="957" y="235" text-anchor="middle" class="p">CEM optimizes a₁:h</text><text x="957" y="270" text-anchor="middle" class="p">min ‖F¹(a₁:h; z₁) − z̃₁‖₁</text><text x="957" y="301" text-anchor="middle" class="small">fine control → preserve precision</text>
<path d="M957 325 L957 435" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="805" y="450" width="305" height="92" class="box" fill="#ede9fe"/><text x="957" y="487" text-anchor="middle" class="h">Execute first k actions</text><text x="957" y="517" text-anchor="middle" class="p">observe → replan (MPC)</text>
<path d="M805 496 L655 496" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="310" y="450" width="345" height="92" class="box" fill="#f1f5f9"/><text x="482" y="487" text-anchor="middle" class="h">Closed-loop correction</text><text x="482" y="517" text-anchor="middle" class="p">new observation replaces prediction</text>
<path d="M310 496 L155 496 L155 380" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#a)"/>
<rect x="55" y="605" width="1085" height="70" rx="14" fill="#0f172a"/><text x="600" y="632" text-anchor="middle" style="font-family:Arial,'Microsoft YaHei',sans-serif;fill:#fff;font-size:18px;font-weight:700">关键思想：高层决定“先做哪一段”，低层决定“每一步怎么做”</text><text x="600" y="657" text-anchor="middle" style="font-family:Arial,'Microsoft YaHei',sans-serif;fill:#cbd5e1;font-size:15px">层级接口是 latent subgoal matching，不是高层策略调用低层策略</text>
</svg>
