<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#334155"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.p{font-size:16px}.s{font-size:14px}.box{stroke:#334155;stroke-width:2;rx:14}</style></defs>
<rect width="1200" height="680" fill="#f8fafc"/><text x="42" y="48" class="title">Training HWM at two temporal scales</text><text x="42" y="77" class="p">Both predictors share encoder E and latent coordinates; only the action resolution differs.</text>
<rect x="50" y="120" width="1100" height="190" class="box" fill="#e0f2fe"/><text x="600" y="153" text-anchor="middle" class="h">Offline trajectory τ = (s₁, a₁, s₂, …, aT, sT)</text>
<rect x="90" y="185" width="290" height="80" class="box" fill="#fff"/><text x="235" y="217" text-anchor="middle" class="p">Low-level sample</text><text x="235" y="244" text-anchor="middle" class="p">(zₜ, primitive aₜ, zₜ₊₁)</text>
<rect x="455" y="185" width="290" height="80" class="box" fill="#fff"/><text x="600" y="217" text-anchor="middle" class="p">Waypoints</text><text x="600" y="244" text-anchor="middle" class="p">zₜₖ = E(sₜₖ), N=3</text>
<rect x="820" y="185" width="290" height="80" class="box" fill="#fff"/><text x="965" y="217" text-anchor="middle" class="p">Action chunk</text><text x="965" y="244" text-anchor="middle" class="p">aₜₖ:ₜₖ₊₁ → Aψ → lₜₖ</text>
<path d="M235 310 L235 380" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M600 310 L600 380" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M965 310 L965 380" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
<rect x="50" y="385" width="500" height="170" class="box" fill="#dcfce7"/><text x="300" y="420" text-anchor="middle" class="h">Low-level F¹θ</text><text x="300" y="451" text-anchor="middle" class="p">causal predictor: (aₜ, zₜ) → ẑₜ₊₁</text><text x="300" y="486" text-anchor="middle" class="p">teacher-forcing + multi-step rollout</text><text x="300" y="525" text-anchor="middle" class="p">L = γtf Ltf + γroll Lroll</text>
<rect x="650" y="385" width="500" height="170" class="box" fill="#fef3c7"/><text x="900" y="420" text-anchor="middle" class="h">High-level F²φ + Aψ</text><text x="900" y="451" text-anchor="middle" class="p">(lₜₖ, zₜₖ) → ẑₜₖ₊₁</text><text x="900" y="486" text-anchor="middle" class="p">teacher forcing only in main recipe</text><text x="900" y="525" text-anchor="middle" class="p">Ltf = 1/N Σ ‖ẑₜₖ₊₁ − zₜₖ₊₁‖₁</text>
<path d="M550 470 L650 470" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="600" y="455" text-anchor="middle" class="s">shared latent space</text>
<rect x="170" y="600" width="860" height="48" rx="12" fill="#0f172a"/><text x="600" y="631" text-anchor="middle" style="font-family:Arial,'Microsoft YaHei',sans-serif;fill:#fff;font-size:17px">训练目标很朴素：预测未来 latent；层级能力主要来自时间尺度与推理接口</text>
</svg>
