<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#34506b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d3445" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <text x="800" y="54" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" fill="#172b3a">JEPA-WM：表征空间预测与规划闭环</text>
  <text x="800" y="88" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="16" fill="#587086">根据 Terver et al., arXiv:2512.24497 Figure 1 重绘</text>

  <rect x="45" y="125" width="735" height="710" rx="22" fill="#eaf3fb" stroke="#8fb4d1" stroke-width="3"/>
  <rect x="820" y="125" width="735" height="710" rx="22" fill="#eef7ef" stroke="#9ac3a0" stroke-width="3"/>
  <text x="412" y="172" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#204b6b">训练：teacher forcing + rollout loss</text>
  <text x="1187" y="172" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#285936">规划：latent-space trajectory optimization</text>

  <g filter="url(#shadow)">
    <rect x="85" y="225" width="175" height="82" rx="14" fill="#fff" stroke="#6c9bc0" stroke-width="2"/>
    <text x="172" y="258" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#204b6b">观测视频</text>
    <text x="172" y="286" text-anchor="middle" font-family="Arial" font-size="17" fill="#587086">o<tspan baseline-shift="sub" font-size="12">t-w:t</tspan></text>
    <rect x="85" y="388" width="175" height="82" rx="14" fill="#fff" stroke="#6c9bc0" stroke-width="2"/>
    <text x="172" y="421" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#204b6b">动作序列</text>
    <text x="172" y="449" text-anchor="middle" font-family="Arial" font-size="17" fill="#587086">a<tspan baseline-shift="sub" font-size="12">t-w:t</tspan></text>
    <rect x="310" y="270" width="210" height="120" rx="14" fill="#dcecf8" stroke="#4f89b5" stroke-width="2"/>
    <text x="415" y="313" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="21" font-weight="700" fill="#204b6b">状态编码器 E</text>
    <text x="415" y="347" text-anchor="middle" font-family="Arial" font-size="16" fill="#34506b">视觉 encoder（冻结）</text>
    <text x="415" y="371" text-anchor="middle" font-family="Arial" font-size="16" fill="#34506b">+ proprio encoder（可选）</text>
    <rect x="310" y="468" width="210" height="92" rx="14" fill="#dcecf8" stroke="#4f89b5" stroke-width="2"/>
    <text x="415" y="505" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="21" font-weight="700" fill="#204b6b">动作编码器 A</text>
    <text x="415" y="535" text-anchor="middle" font-family="Arial" font-size="16" fill="#34506b">可训练</text>
    <rect x="575" y="335" width="165" height="145" rx="14" fill="#b9d9ef" stroke="#3b78a6" stroke-width="3"/>
    <text x="657" y="378" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#163e5b">预测器 P</text>
    <text x="657" y="412" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="16" fill="#204b6b">ViT / AdaLN</text>
    <text x="657" y="438" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="16" fill="#204b6b">预测未来 latent</text>
    </g>
  <line x1="260" y1="266" x2="310" y2="315" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="260" y1="429" x2="310" y2="515" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="520" y1="330" x2="575" y2="375" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="520" y1="515" x2="575" y2="430" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="740" y1="407" x2="740" y2="650" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="155" y="650" width="545" height="105" rx="15" fill="#fff" stroke="#6c9bc0" stroke-width="2"/>
  <text x="427" y="690" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#204b6b">目标状态 E(o<tspan baseline-shift="sub" font-size="12">t+1</tspan>)</text>
  <text x="427" y="725" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" fill="#34506b">MSE：预测 latent 与目标 latent 的距离</text>
  <text x="427" y="747" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="15" fill="#587086">额外加入 L₂ rollout loss，训练模型面对自身预测</text>

  <g filter="url(#shadow)">
    <rect x="855" y="220" width="175" height="82" rx="14" fill="#fff" stroke="#76aa80" stroke-width="2"/>
    <text x="942" y="253" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#285936">初始观测</text>
    <text x="942" y="281" text-anchor="middle" font-family="Arial" font-size="17" fill="#52705a">o<tspan baseline-shift="sub" font-size="12">t</tspan></text>
    <rect x="855" y="390" width="175" height="82" rx="14" fill="#fff" stroke="#76aa80" stroke-width="2"/>
    <text x="942" y="423" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#285936">目标观测</text>
    <text x="942" y="451" text-anchor="middle" font-family="Arial" font-size="17" fill="#52705a">o<tspan baseline-shift="sub" font-size="12">g</tspan></text>
    <rect x="1080" y="270" width="205" height="115" rx="14" fill="#d9efdc" stroke="#579b63" stroke-width="2"/>
    <text x="1182" y="310" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="21" font-weight="700" fill="#285936">采样动作序列</text>
    <text x="1182" y="344" text-anchor="middle" font-family="Arial" font-size="17" fill="#52705a">a<tspan baseline-shift="sub" font-size="12">t:t+H-1</tspan></text>
    <text x="1182" y="368" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="15" fill="#52705a">候选轨迹群</text>
    <rect x="1335" y="270" width="175" height="115" rx="14" fill="#bfe1c4" stroke="#579b63" stroke-width="3"/>
    <text x="1422" y="311" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="21" font-weight="700" fill="#285936">预测器展开</text>
    <text x="1422" y="345" text-anchor="middle" font-family="Arial" font-size="17" fill="#285936">ẑ<tspan baseline-shift="sub" font-size="12">t+1:t+H</tspan></text>
    <text x="1422" y="369" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="15" fill="#285936">F / P unroll</text>
    </g>
  <line x1="1030" y1="260" x2="1080" y2="315" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1285" y1="327" x2="1335" y2="327" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1030" y1="431" x2="1310" y2="431" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1175" y="420" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="15" fill="#52705a">编码后与预测 latent 比较</text>
  <rect x="1000" y="530" width="430" height="110" rx="15" fill="#fff" stroke="#76aa80" stroke-width="2"/>
  <text x="1215" y="570" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="21" font-weight="700" fill="#285936">规划代价 Lp</text>
  <text x="1215" y="606" text-anchor="middle" font-family="Arial" font-size="19" fill="#52705a">Lvis + α Lprop</text>
  <line x1="1422" y1="385" x2="1422" y2="530" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="930" y="700" width="570" height="75" rx="15" fill="#d9efdc" stroke="#579b63" stroke-width="2"/>
  <text x="1215" y="746" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#285936">CEM L2：迭代更新动作分布 → 执行前 m 步 → MPC 重规划</text>
  <line x1="1215" y1="640" x2="1215" y2="700" stroke="#34506b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="875" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="16" fill="#587086">核心直觉：预测器不生成像素，而是预测对规划有用的未来状态表征</text>
</svg>
